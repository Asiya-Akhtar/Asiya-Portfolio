<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080818" />
      <stop offset="50%" stop-color="#0f0f2d" />
      <stop offset="100%" stop-color="#180e29" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  
  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>
  
  <!-- Decorative Abstract Glowing Shapes -->
  <circle cx="1000" cy="150" r="180" fill="#8b5cf6" fill-opacity="0.1" filter="url(#glow)" />
  <circle cx="1100" cy="450" r="150" fill="#3b82f6" fill-opacity="0.08" filter="url(#glow)" />
  
  <!-- Logo / Initial Badge -->
  <g transform="translate(100, 100)">
    <circle cx="40" cy="40" r="40" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="2" />
    <text x="40" y="49" font-family="'Outfit', 'Inter', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">AA</text>
  </g>
  
  <!-- Title / Heading -->
  <text x="100" y="270" font-family="'Outfit', 'Inter', sans-serif" font-size="80" font-weight="900" fill="url(#textGrad)">Asiya Akhtar</text>
  
  <!-- Subtitle -->
  <text x="100" y="340" font-family="'Inter', sans-serif" font-size="32" font-weight="600" fill="#ffffff" fill-opacity="0.9">AI &amp; Computer Vision Engineer</text>
  
  <!-- Description -->
  <text x="100" y="410" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#9ca3af" fill-opacity="0.8">
    <tspan x="100" dy="0">Graduated Computer Scientist building smart perception systems</tspan>
    <tspan x="100" dy="30">using Deep Learning, Computer Vision, and IoT integrations.</tspan>
  </text>
  
  <!-- Bottom details / Badge links -->
  <g transform="translate(100, 520)">
    <!-- Available tag -->
    <rect width="320" height="40" rx="20" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="25" cy="20" r="5" fill="#10b981" />
    <text x="42" y="26" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#34d399">Available for Research &amp; Collaboration</text>
  </g>
  
  <!-- Cybernetic Grid Line Graphic on the right -->
  <g transform="translate(750, 180)" stroke="#8b5cf6" stroke-opacity="0.2" fill="none" stroke-width="2">
    <!-- Brain / Neural Net nodes representation -->
    <line x1="100" y1="150" x2="200" y2="70" />
    <line x1="100" y1="150" x2="200" y2="230" />
    <line x1="200" y1="70" x2="300" y2="100" />
    <line x1="200" y1="230" x2="300" y2="200" />
    <line x1="300" y1="100" x2="300" y2="200" />
    
    <circle cx="100" cy="150" r="10" fill="#8b5cf6" fill-opacity="0.8" filter="url(#glow)" />
    <circle cx="200" cy="70" r="8" fill="#3b82f6" fill-opacity="0.8" />
    <circle cx="200" cy="230" r="8" fill="#3b82f6" fill-opacity="0.8" />
    <circle cx="300" cy="100" r="12" fill="#8b5cf6" fill-opacity="0.8" filter="url(#glow)" />
    <circle cx="300" cy="200" r="6" fill="#10b981" fill-opacity="0.8" />
  </g>
</svg>
